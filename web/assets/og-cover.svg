<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>
  <rect width="1200" height="630" fill="url(#glowSpot)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Shellaquiles Top Bar -->
  <g transform="translate(80, 80)">
    <rect width="170" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="85" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">SHELLAQUILES</text>
    <text x="190" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">shellaquiles.org/hit-tazos-tech</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 210)">
    <!-- Brand Icon -->
    <rect x="0" y="-70" width="76" height="76" rx="20" fill="url(#brandGrad)"/>
    <path d="M 44 -56 L 22 -22 L 40 -22 L 34 6 L 60 -28 L 42 -28 Z" fill="#ffffff"/>

    <text x="96" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">HIT-TAZOS</text>
    <rect x="490" y="-62" width="94" height="42" rx="10" fill="#4f46e5"/>
    <text x="537" y="-35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">TECH</text>
    <text x="604" y="-35" font-family="'JetBrains Mono', monospace, monospace" font-size="16" font-weight="600" fill="#94a3b8">v1.0.0-rc3</text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#e2e8f0">
    Trivia Cronológica Técnica · Hitos Verificados
  </text>
  <text x="80" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    El juego de mesa definitivo sobre la evolución del software, Python, Linux, DevOps, IA y cultura hacker.
  </text>

  <!-- Pill Categories -->
  <g transform="translate(80, 375)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="21" fill="rgba(34, 197, 94, 0.12)" stroke="#22c55e" stroke-width="1"/>
    <text x="90" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">🐍 Universo Python</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="190" height="42" rx="21" fill="rgba(59, 130, 246, 0.12)" stroke="#3b82f6" stroke-width="1"/>
    <text x="290" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle">💻 Software &amp; Web</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="185" height="42" rx="21" fill="rgba(249, 115, 22, 0.12)" stroke="#f97316" stroke-width="1"/>
    <text x="492" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fb923c" text-anchor="middle">⚡ DevOps &amp; Infra</text>

    <!-- Pill 4 -->
    <rect x="600" y="0" width="170" height="42" rx="21" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1"/>
    <text x="685" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="middle">🤖 Cómputo &amp; IA</text>

    <!-- Pill 5 -->
    <rect x="785" y="0" width="185" height="42" rx="21" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="1"/>
    <text x="877" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="middle">🛡️ Cultura Hacker</text>
  </g>

  <!-- Bottom Badges / CTA -->
  <g transform="translate(80, 510)">
    <rect x="0" y="0" width="310" height="48" rx="14" fill="#38bdf8"/>
    <text x="155" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">JUGAR EN LÍNEA GRATIS</text>

    <rect x="330" y="0" width="330" height="48" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <text x="495" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Descargar PDF (Carta / Tabloide)</text>

    <text x="1040" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#64748b" text-anchor="end">Licencia MIT · Shellaquiles Org</text>
  </g>
</svg>
