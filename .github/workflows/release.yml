name: Release Oficial y PDFs (Carta por Volumen)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Leer versión canónica y extraer notas de release
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          python3 -c '
import re, pathlib
version = pathlib.Path("VERSION").read_text().strip()
changelog = pathlib.Path("CHANGELOG.md").read_text()
pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
match = re.search(pattern, changelog, re.DOTALL)
notes = match.group(1).strip() if match else f"Hit-Tazos Tech versión {version}"
pathlib.Path("RELEASE_NOTES.md").write_text(notes)
'

      - name: Instalar herramientas de imprenta (librsvg, poppler, ghostscript)
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin poppler-utils ghostscript

      - name: Validar baraja y datos (Audit Deck)
        run: npm run validate

      - name: Generar PDFs por volumen en tamaño Carta (nombres canónicos)
        run: npm run print:carta:volumes

      - name: Publicar GitHub Release y adjuntar PDFs con gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" print/v*/carta/hit-tazos-tech-vol*.pdf \
            --title "Hit-Tazos Tech v${VERSION}" \
            --notes-file RELEASE_NOTES.md
