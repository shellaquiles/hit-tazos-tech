          <tspan x="92.13" y="125.0">Inventaron traducción binaria al</tspan><tspan x="92.13" y="134.8">vuelo para sortear limitaciones</tspan><tspan x="92.13" y="144.6">x86 que no permitían virtualizar</tspan><tspan x="92.13" y="154.4">por hardware.</tspan>
