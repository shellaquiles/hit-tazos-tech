        <text font-family="'Outfit', sans-serif" font-size="8.8" font-weight="600" fill="#111111" text-anchor="middle">
          <tspan x="92.13" y="28.5">Autor desconocido</tspan>
        </text>
        <text x="92.13" y="104" font-family="'Space Grotesk', sans-serif" font-size="54" font-weight="900" letter-spacing="-1.8" fill="#111111" text-anchor="middle">2003</text>
        <text font-family="'Outfit', sans-serif" font-size="7.4" font-weight="400" font-style="italic" fill="#111111" text-anchor="middle">
          <tspan x="92.13" y="125.0">Con apenas 376 bytes en un</tspan><tspan x="92.13" y="134.8">paquete UDP sobre SQL Server,</tspan><tspan x="92.13" y="144.6">saturó routers y paralizó</tspan><tspan x="92.13" y="154.4">cajeros y aeropuertos globales.</tspan>
